[project]
name = "iphone-phone-lab"
version = "0.3.0"
description = "Owned mobile benchmark, generated evaluation and virtual control"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "pillow==11.2.1", "numpy==2.2.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "playwright==1.51.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
