[project]
name = "iphone-audio-inbox"
version = "0.1.0"
description = "Local audio inbox and reviewed transcript goals"
requires-python = "==3.12.*"
dependencies = ["httpx==0.28.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audio_inbox"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pyright==1.1.414"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
